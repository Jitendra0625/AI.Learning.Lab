# Local Postgres for the agent API.
#   docker compose up -d        start it (first time it downloads the image)
#   docker compose ps           check it is "healthy"
#   docker compose down         stop it, data is KEPT in the named volume
#   docker compose down -v      stop it AND delete all data
#
# The password is for local development only. The port is bound to 127.0.0.1, so only this
# computer can connect.
services:
  db:
    image: postgres:17
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent_pgdata:
